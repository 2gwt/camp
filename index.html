<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>하지 못한 말 캠프 소감</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* 파스텔 하늘 알약 UI(계획표와 같은 결). 한 칼럼 폼: 원고지 칸 머리 → 학번·이름 → 기억에 남는 활동(칩) → 소감 → 제출 */
:root{
  --bg:#f2f7fd;--surface:#fff;--ink:#0b2440;--muted:#55657a;--line:#dce5f0;
  --accent:#8fcbff;--accent-soft:#e0f0ff;--a1:#cfe9ff;--a2:#b9e3f5;--a3:#dff3ff;--a4:#c7dcff;
  --ok:#1e6b32;--ok-soft:#d8f1c6;--danger:#b4231b;--danger-soft:#fde6e3;
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);--pop:cubic-bezier(.3,1.5,.5,1);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.7 var(--font);word-break:keep-all;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:640px;margin:0 auto;padding-block:36px 64px;display:flex;flex-direction:column;gap:22px}
h1,h2{margin:0;font-weight:900;letter-spacing:-.05em;text-wrap:balance}
p{margin:0}
.kicker{align-self:flex-start;font:600 12.5px/1 var(--mono);letter-spacing:.14em;padding:8px 12px;border-radius:999px;background:var(--accent)}
.cells{display:flex;gap:0}
.cells span{width:46px;height:46px;display:grid;place-items:center;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);font:900 24px/1 var(--font);margin-right:-1px}
.cells .blank{background:var(--accent)}
.cells .blank::after{content:"";width:3px;height:46%;background:var(--ink);animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
h1{font-size:clamp(30px,6vw,42px);line-height:1.12}
.lead{color:color-mix(in srgb,var(--ink) 78%,#fff);font-size:16px}

.card{background:var(--surface);border-radius:24px;padding:24px;box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;gap:18px}
.row2{display:grid;grid-template-columns:1fr 1.4fr;gap:12px}
@media (max-width:480px){.row2{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:8px;font-weight:800;font-size:15px;min-width:0}
label.f small,.q small{font-weight:500;color:var(--muted);font-size:13.5px}
input[type=text],textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:0;border-radius:16px;padding:12px 16px;box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .2s}
input[type=text]{height:52px}
input::placeholder,textarea::placeholder{color:#9aa8b8}
textarea{min-height:170px;resize:vertical;line-height:1.7}
input[type=text]:focus,textarea:focus{outline:none;box-shadow:0 0 0 1.5px var(--ink)}
.q{display:flex;flex-direction:column;gap:10px;font-weight:800;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{position:relative;cursor:pointer}
.chips input{position:absolute;opacity:0;pointer-events:none}
.chips span{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:999px;background:var(--a3);font-weight:700;font-size:14.5px;transition:transform .25s var(--ease),box-shadow .2s,background-color .2s}
.chips label:nth-child(4n+2) span{background:var(--a1)}.chips label:nth-child(4n+3) span{background:var(--a2)}.chips label:nth-child(4n) span{background:var(--a4)}
.chips label:hover span{transform:translateY(-2px);box-shadow:0 0 0 1.5px var(--ink)}
.chips input:checked+span{background:var(--accent);box-shadow:0 0 0 1.5px var(--ink)}
.chips input:checked+span::before{content:"✓";font-weight:900}
.chips input:focus-visible+span{outline:3px solid var(--ink);outline-offset:2px}
.count{align-self:flex-end;font:600 12.5px/1 var(--mono);color:var(--muted)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:58px;padding:0 30px;border-radius:999px;border:0;font:inherit;font-weight:900;font-size:17px;color:var(--ink);background:var(--accent);cursor:pointer;transition:transform .22s var(--ease),box-shadow .22s}
.btn:hover{transform:translateY(-3px);box-shadow:0 0 0 1.5px var(--ink)}
.btn:active{transform:scale(.96)}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.btn[disabled]{opacity:.55;cursor:wait;transform:none}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1.5px var(--ink)}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.msg{padding:12px 16px;border-radius:16px;font-size:14.5px;font-weight:600}
.msg.bad{background:var(--danger-soft);color:var(--danger)}
.msg.warn{background:#fff0c2;color:#7a4f00}

.done{background:var(--surface);border-radius:28px;padding:36px 26px;box-shadow:inset 0 0 0 1px var(--line);text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.stamp{width:96px;height:96px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font:900 22px/1.1 var(--font);letter-spacing:-.04em;animation:stamp .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes stamp{from{transform:rotate(12deg) scale(2.2);opacity:0}to{transform:none;opacity:1}}
.done h2{font-size:28px}
.foot{font:600 12px/1.6 var(--mono);color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){*,::before,::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="wrap">
  <span class="kicker">CAMP · 11/3–5</span>
  <div class="cells" aria-label="하지 못한 말"><span>하</span><span>지</span><span>못</span><span>한</span><span>말</span><span class="blank" aria-hidden="true"></span></div>
  <h1>사흘 동안 작가였던 나에게,<br>한마디 남겨 주세요</h1>
  <p class="lead">정답은 없어요. 솔직하게 써 주면 다음 캠프를 만드는 데 그대로 쓰여요.</p>

  <form class="card" id="form" novalidate>
    <label class="f" for="sid">학번 <small>학교 계정 @ 앞의 숫자 8자리예요. 이름은 쓰지 않아도 돼요.</small>
      <input type="text" id="sid" name="sid" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="예: 20250186" required>
    </label>

    <div class="q" role="group" aria-labelledby="q-act">
      <span id="q-act">가장 기억에 남는 활동 <small>여러 개 골라도 돼요</small></span>
      <div class="chips" id="acts"></div>
    </div>

    <label class="f" for="text">캠프 소감
      <small>무엇이 좋았는지, 무엇이 어려웠는지, AI와 함께 써 보니 어땠는지 자유롭게 써 주세요.</small>
      <textarea id="text" name="text" maxlength="1500" required></textarea>
    </label>
    <span class="count" id="count">0 / 1500자</span>

    <div id="err" hidden></div>
    <div class="actions">
      <button class="btn" type="submit" id="send">소감 보내기</button>
    </div>
  </form>

  <section class="done" id="done" hidden aria-live="polite">
    <span class="stamp">작가<br>완료</span>
    <h2>소감을 받았어요</h2>
    <p id="doneText">사흘 동안 정말 수고 많았어요.</p>
    <button class="btn ghost" type="button" id="again">하나 더 쓰기</button>
  </section>

  <p class="foot">2026학년도 AI중점학교 2학기 AI+X 국어 교과 프로그램 · 지도 교사 우수연, 이광</p>
</main>

<!-- 구글 설문지로 보내는 통로(화면에 보이지 않음) -->
<iframe name="sink" id="sink" title="제출용" hidden></iframe>

<script>
/* ───── 설정: 구글 설문지 연결 ─────
   FORM_ID: 설문지 '미리 채워진 링크'의 /d/e/ 와 /viewform 사이 글자
   ENTRY: 각 문항의 entry 번호 */
var CONFIG = {
  FORM_ID: '1FAIpQLSfJ2JpxdRfEG1DLGKd4TQrlVy9_opZZQSxEAVJvxyTAA48qcA',
  ENTRY: { sid: '1143803469', acts: '1706752263', text: '2141147933' }
};
var ACTS = ['AI 소설 찾기', '하지 못한 말 이야기 나누기', '인물 관계 카드·AI 인터뷰', '주인공 소개', '버린 전개 벽', '줄거리 네 줄', '손글씨 초고', '옮겨 쓰며 고쳐 쓰기', 'AI 비평'];

var $ = function (s) { return document.querySelector(s); };
$('#acts').innerHTML = ACTS.map(function (a, i) {
  return '<label for="a' + i + '"><input type="checkbox" id="a' + i + '" value="' + a + '"><span>' + a + '</span></label>';
}).join('');
var ready = CONFIG.FORM_ID && CONFIG.ENTRY.sid && CONFIG.ENTRY.text;
function showErr(msg, warn) { var e = $('#err'); e.className = 'msg ' + (warn ? 'warn' : 'bad'); e.textContent = msg; e.hidden = !msg; }
if (!ready) showErr('아직 설문지와 연결되지 않은 미리보기예요. 선생님이 연결하면 제출할 수 있어요.', true);

$('#text').addEventListener('input', function () { $('#count').textContent = this.value.length + ' / 1500자'; });
$('#sid').addEventListener('input', function () { this.value = this.value.replace(/\D/g, ''); });

$('#form').addEventListener('submit', function (ev) {
  ev.preventDefault();
  var sid = $('#sid').value.trim(), text = $('#text').value.trim();
  if (!/^\d{8}$/.test(sid)) { showErr('학번 8자리를 숫자로 써 주세요. 학교 계정 @ 앞의 숫자예요.'); $('#sid').focus(); return; }
  if (text.length < 10) { showErr('소감을 조금만 더 써 주세요. 한두 문장이면 충분해요.'); $('#text').focus(); return; }
  if (!ready) { showErr('아직 설문지와 연결되지 않아 보낼 수 없어요. 선생님께 알려 주세요.'); return; }
  showErr('');
  var acts = Array.prototype.map.call(document.querySelectorAll('#acts input:checked'), function (x) { return x.value; });
  // 숨은 폼을 만들어 구글 설문지로 전송
  var f = document.createElement('form');
  f.method = 'POST'; f.target = 'sink'; f.hidden = true;
  f.action = 'https://docs.google.com/forms/d/e/' + CONFIG.FORM_ID + '/formResponse';
  function add(k, v) { var i = document.createElement('input'); i.type = 'hidden'; i.name = 'entry.' + k; i.value = v; f.appendChild(i); }
  add(CONFIG.ENTRY.sid, sid); add(CONFIG.ENTRY.text, text);
  if (CONFIG.ENTRY.acts) acts.forEach(function (a) { add(CONFIG.ENTRY.acts, a); });
  document.body.appendChild(f);
  var btn = $('#send'); btn.disabled = true; btn.textContent = '보내는 중…';
  var finished = false;
  function finish() {
    if (finished) return; finished = true;
    f.remove(); btn.disabled = false; btn.textContent = '소감 보내기';
    $('#form').hidden = true; $('#done').hidden = false;
    $('#doneText').textContent = '사흘 동안 정말 수고 많았어요. 작가님의 다음 소설을 기다릴게요.';
    window.scrollTo(0, 0);
  }
  $('#sink').onload = finish;
  setTimeout(finish, 4000);
  f.submit();
});
$('#again').addEventListener('click', function () {
  $('#form').reset(); $('#count').textContent = '0 / 1500자';
  $('#done').hidden = true; $('#form').hidden = false;
});
</script>
</body>
</html>
